name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/privyet-klopkod-ff6rkf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages включается один раз вручную:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Токен воркфлоу не может создать сайт сам (нужны права администратора).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
